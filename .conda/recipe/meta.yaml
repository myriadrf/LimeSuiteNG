
package:
  name:  limesuiteng
  version: 25.1.0

source:
  path: "../.."
  git_url: {{ environ.get('FEEDSTOCK_ROOT', "../..") }}
  git_url: https://github.com/myriadrf/LimeSuiteNG.git
  git_rev: docs-upgrade

build:
  number: 0

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - cmake
    - git
    - ninja
    - pkg-config
    - python =3.12.9
    - cross-python_{{ target_platform }}
    - numpy
    - vs2022_win-64

  host:
    - pip
    - python =3.12.9
    - numpy

  run:
    - numpy
    - python =3.12.9

