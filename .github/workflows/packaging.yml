# .github/workflows/packaging.yml
#
# GitHub Actions workflow for the LimeSuiteNG Launchpad PPA.
#
#   source-check : on every PR/push, build the SOURCE package + run lintian
#                  (fast sanity check; no binaries are built here).
#   ppa-upload   : on manual dispatch (or push to stable), build a signed source
#                  package per Ubuntu series and upload it to the PPA. Launchpad
#                  then compiles the binaries (amd64, arm64, ...) itself.

name: Packaging

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload source packages to the Launchpad PPA"
        type: boolean
        default: false
  pull_request:
    branches: [stable, develop]
  push:
    branches: [stable]
    paths:
      - 'debian/**'
      - '**.CMakeLists'

env:
  # Target Launchpad PPA. Change this to your PPA.
  PPA: ppa:myriadrf/limesuiteng

jobs:
  # ---------------------------------------------------------------------------
  # Fast sanity check on every PR/push: does the source package build + lint?
  # ---------------------------------------------------------------------------
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devscripts debhelper dh-python dh-dkms lintian
      - name: Build source package + lintian
        run: |
          export DEBFULLNAME="Lime Microsystems" DEBEMAIL="apps@limemicro.com"
          ( cd debian && ./set_debian_changelog_codenames.sh "$(lsb_release -cs)" )
          dpkg-buildpackage -S -d -us -uc
          lintian ../limesuiteng_*_source.changes

  # ---------------------------------------------------------------------------
  # Build a signed source package per series and upload it to the PPA.
  # Runs only on manual dispatch (with "upload" ticked) or push to stable.
  # ---------------------------------------------------------------------------
  ppa-upload:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.upload) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/stable')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu series to upload. Launchpad builds each for the architectures
        # enabled on the PPA (e.g. amd64, arm64). Add more series here as needed.
        series: [noble, jammy]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devscripts debhelper dh-python dh-dkms dput
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass"
          echo "GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build, sign, upload
        env:
          SERIES: ${{ matrix.series }}
          PPA: ${{ env.PPA }}
          GPG_PASSPHRASE_FILE: ${{ runner.temp }}/gpg-pass
        run: ./tools/ppa/upload.sh
