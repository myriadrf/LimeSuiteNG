{% set oot_name = "limesuiteng" %}
{% set name = "gnuradio-" + oot_name %}

package:
  name:  {{ name }}
  version:  1.0.0

source:
  path: "../.."

build:
  number: 0

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - cmake
    - git
    - ninja
    - pkg-config
    - python =3.12.9
    - cross-python_{{ target_platform }}
    - numpy =1.26.4
    - pybind11 =2.11.1
    - vs2022_win-64

  host:
    - gmp
    - gnuradio-core =3.10.9.2
    - gnuradio-core =3.10.9.2 {{ gnuradio_extra_pin }}.*
    - boost =1.82
    - limesuiteng
    - pip
    - pybind11 =2.11.1
    - python =3.12.9
    - numpy =1.26.4
    - volk =3.1.2

  run:
    - numpy =1.26.4
    - python =3.12.9
    - gnuradio-core =3.10.9.2

test:
  commands:
    # Add a list of commands to run to check that the package works. Examples below.

    ## verify that commands run
    #- COMMAND --help

    ## verify that (some) headers get installed
    # - test -f $PREFIX/include/gnuradio/{{ oot_name }}/api.h  # [not win]
    # - if not exist %PREFIX%\\Library\\include\\gnuradio\\{{ oot_name }}\\api.h exit 1  # [win]

    ## verify that libraries get installed
    #- test -f $PREFIX/lib/lib{{ name }}${SHLIB_EXT}  # [not win]
    #- if not exist %PREFIX%\\Library\\bin\\{{ name }}.dll exit 1  # [win]
    #- if not exist %PREFIX%\\Library\\lib\\{{ name }}.lib exit 1  # [win]

    ## verify that (some) GRC blocks get installed
    #{% set blocks = ["LIST", "OF", "GRC", "BLOCK", "NAMES"] %}
    #{% for block in blocks %}
    #- test -f $PREFIX/share/gnuradio/grc/blocks/{{ block }}.block.yml  # [not win]
    #- if not exist %PREFIX%\\Library\\share\\gnuradio\\grc\\blocks\\{{ block }}.block.yml exit 1  # [win]
    #{% endfor %}

  imports:
    # verify that the python module imports
    # - gnuradio.{{ oot_name }}

about:
  home: https://github.com/myriadrf/LimeSuiteNG
  license: Apache-2.0
  license_url: https://github.com/myriadrf/LimeSuiteNG?tab=Apache-2.0-1-ov-file#readme
  summary: GNURadio-limesuiteng is a GNURadio compatible plugin based on the Lime Suite NG new generation software suite designed for working with LimeSDR family devices.
  dev_url: https://github.com/myriadrf/LimeSuiteNG
  doc_url: https://limesuiteng.myriadrf.org/
